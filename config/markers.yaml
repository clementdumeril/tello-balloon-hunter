# Marker map: the SINGLE source of truth for the marker layout.
# Used by the Gazebo world generator (src/tello_sim) AND by the real localizer.
# Frame `map`: origin at a room corner on the floor, x along the west->east wall, y south->north, z up.
# Each marker: center position (m) and yaw_deg = direction the marker FACES (its normal), marker upright.
# Marker frame = OpenCV convention: x right, y up, z out of the marker (toward the viewer).
#
# PLACEHOLDER layout (task B4 will replace it with the real survey of the room):
# 4.0 x 3.5 m room, 3.0 m ceiling, 2 rows (z = 0.9 and 1.5 m), spacing 0.6 m.

dictionary: DICT_6X6_50     # the markers actually printed and stuck on the walls (ID 12 seen Nov 9)
marker_size: 0.20          # side of the black square, meters (measured on the real sheets: 20 cm, Nov 9)

room:                      # used by the simulator only
  size_x: 4.0
  size_y: 3.5
  height: 3.0

markers:
  # --- west  x=0 wall, markers face yaw=0 deg
  - {id:  0, x: 0.005, y: 0.550, z: 0.90, yaw_deg:    0}
  - {id:  1, x: 0.005, y: 1.150, z: 0.90, yaw_deg:    0}
  - {id:  2, x: 0.005, y: 1.750, z: 0.90, yaw_deg:    0}
  - {id:  3, x: 0.005, y: 2.350, z: 0.90, yaw_deg:    0}
  - {id:  4, x: 0.005, y: 2.950, z: 0.90, yaw_deg:    0}
  - {id:  5, x: 0.005, y: 0.550, z: 1.50, yaw_deg:    0}
  - {id:  6, x: 0.005, y: 1.150, z: 1.50, yaw_deg:    0}
