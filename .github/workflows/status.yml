name: Update status page

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned]
  milestone:
    types: [created, edited, closed, opened]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: status-page
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate STATUS.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_status.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md README.md
          git commit -m "chore: update status page"
          git pull --rebase
          git push
